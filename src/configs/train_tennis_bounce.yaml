# @package _global_

defaults:
  - dataset: tennis
  - model: wasb
  - dataloader: default
  - loss: combined
  - optimizer: adam_multistep
  - runner: train_tennis_bounce
  - transform: default

# Dataset configuration
dataset:
  name: tennis
  ext: '.jpg'
  root_dir: /root/datasets/tennis
  csv_filename: 'Label.csv'
  visible_flags: [1,2]
  bounce_column: 'bounce'  # Column name for bounce annotations
  train:
    matches: [ 'game1', 'game2', 'game3', 'game4', 'game5', 'game6', 'game7']
    num_clip_ratio: 1.0
    refine_npz_path: 
  test:
    matches: [ 'game8', 'game9', 'game10']
    num_clip_ratio: 1.0
    refine_npz_path:

# Model configuration
model:
  name: hrnet
  frames_in: 3
  frames_out: 3
  inp_height: 288
  inp_width: 512
  out_height: 288
  out_width: 512
  rgb_diff: False
  out_scales: [0]
  enable_bounce_detection: true
  MODEL:
    EXTRA:
      FINAL_CONV_KERNEL: 1
      PRETRAINED_LAYERS: ['*']
      STEM:
        INPLANES: 64
        STRIDES: [1,1]
      STAGE1:
        NUM_MODULES: 1
        NUM_BRANCHES: 1
        BLOCK: BOTTLENECK
        NUM_BLOCKS: [1]
        NUM_CHANNELS: [32]
        FUSE_METHOD: SUM
      STAGE2:
        NUM_MODULES: 1
        NUM_BRANCHES: 2
        BLOCK: BASIC
        NUM_BLOCKS: [2,2]
        NUM_CHANNELS: [16,32]
        FUSE_METHOD: SUM
      STAGE3:
        NUM_MODULES: 1
        NUM_BRANCHES: 3
        BLOCK: BASIC
        NUM_BLOCKS: [2,2,2]
        NUM_CHANNELS: [16,32,64]
        FUSE_METHOD: SUM
      STAGE4:
        NUM_MODULES: 1
        NUM_BRANCHES: 4
        BLOCK: BASIC
        NUM_BLOCKS: [2,2,2,2]
        NUM_CHANNELS: [16,32,64,128]
        FUSE_METHOD: SUM
      DECONV:
        NUM_DECONVS: 0
        KERNEL_SIZE: []
        NUM_BASIC_BLOCKS: 2
    INIT_WEIGHTS: True

# Dataloader configuration
dataloader:
  train: true
  test: true
  train_clip: false
  test_clip: false
  sampler:
    name: random
    train_batch_size: 8
    train_shuffle_batch: true
    train_drop_last: true
    test_batch_size: 8
    test_shuffle_batch: false
    test_drop_last: false
  train_num_workers: 8
  test_num_workers: 8
  heatmap:
    name: binary_fixed_size
    sigmas: [2.5]
    mags: [1.0]
    min_value: 0.6
    enable_bounce: true

# Loss configuration
loss:
  name: combined
  enable_bounce_detection: true
  ball_weight: 1.0
  bounce_weight: 0.5
  bounce_loss:
    loss_type: 'bce'
    auto_weight: false
    scales: [0]
    neg_factor: 3

# Optimizer configuration
optimizer:
  name: adam
  lr: 0.001
  weight_decay: 0.0001
  lr_scheduler:
    name: multistep
    milestones: [50, 80]
    gamma: 0.1

# Runner configuration
runner:
  name: train
  device: cuda
  gpus: [0]
  max_epochs: 100
  seed: 42
  test:
    run: true
    epoch_start: 10
    epoch_step: 5
    run_before_train: false
    run_after_train_with_best: true
  inference_video:
    run: false
    epoch_start: 0
    epoch_step: 10
    run_before_train: false
    run_after_train_with_best: false
  best_model_name: 'best_model.pth.tar'
  checkpoint_dir: 'checkpoints'

# Transform configuration
transform:
  train:
    color_jitter:
      p: 0.5
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.1
  test:
    color_jitter:
      p: 0.0
      brightness: 0.0
      contrast: 0.0
      saturation: 0.0
      hue: 0.0
