name: train
device: cuda
gpus: [0]
max_epochs: 100
seed: 42

# Test configuration
test:
  run: true
  epoch_start: 10
  epoch_step: 5
  run_before_train: false
  run_after_train_with_best: true

# Inference video configuration
inference_video:
  run: false
  epoch_start: 0
  epoch_step: 10
  run_before_train: false
  run_after_train_with_best: false

# Model checkpoint configuration
best_model_name: 'best_model.pth.tar'
checkpoint_dir: 'checkpoints'
